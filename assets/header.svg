<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" fill="none" role="img" aria-label="Kai Cryan — Macrodata Refinement personnel file">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2b38"/>
      <stop offset="0.55" stop-color="#08222c"/>
      <stop offset="1" stop-color="#061922"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.42" r="0.9">
      <stop offset="0" stop-color="#0f4a5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#061922" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="0" fill="#8fe8f2" opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <style>
      .mono { font-family: 'SF Mono','SFMono-Regular','DejaVu Sans Mono','Liberation Mono','Consolas',monospace; }
      .name { font-weight: 700; letter-spacing: 6px; }
      .kick { letter-spacing: 4px; }
      .tiny { letter-spacing: 2px; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="878" height="258" rx="10" fill="url(#bg)"/>
  <rect x="1" y="1" width="878" height="258" rx="10" fill="url(#glow)"/>
  <rect x="1" y="1" width="878" height="258" rx="10" fill="url(#scan)"/>
  <rect x="1.5" y="1.5" width="877" height="257" rx="9.5" fill="none" stroke="#1c4c5b" stroke-width="1"/>

  <!-- corner brackets -->
  <g stroke="#57d9e8" stroke-width="2" opacity="0.85" fill="none">
    <path d="M18 40 V18 H40"/>
    <path d="M862 40 V18 H840"/>
    <path d="M18 220 V242 H40"/>
    <path d="M862 220 V242 H840"/>
  </g>

  <!-- top row -->
  <g class="mono">
    <text x="40" y="46" class="kick" font-size="13" fill="#57d9e8" opacity="0.9">LUMON<tspan fill="#3f8391">  ·  INDUSTRIES</tspan></text>
    <text x="840" y="46" class="tiny" font-size="12" fill="#3f8391" text-anchor="end">MACRODATA REFINEMENT</text>
  </g>
  <line x1="40" y1="58" x2="840" y2="58" stroke="#173f4c" stroke-width="1"/>

  <!-- name block -->
  <g class="mono">
    <text x="40" y="118" class="name" font-size="40" fill="#eaf7f9" filter="url(#soft)">KAI CRYAN</text>
    <text x="42" y="146" class="tiny" font-size="13" fill="#57d9e8" opacity="0.9">SOFTWARE ENGINEER</text>
    <text x="42" y="146" class="tiny" font-size="13" fill="#3f8391" transform="translate(190,0)">// SYDNEY, AU</text>
  </g>

  <!-- prompt line with blinking cursor -->
  <g class="mono">
    <text x="42" y="184" font-size="14" fill="#8fb7bf">&gt; please enjoy each repository equally<tspan dx="3" fill="#57d9e8">&#x258B;<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- refinement meter -->
  <g class="mono">
    <text x="42" y="222" class="tiny" font-size="11" fill="#3f8391">REFINEMENT</text>
    <rect x="132" y="212" width="300" height="8" rx="4" fill="#0e3541" stroke="#1c4c5b" stroke-width="1"/>
    <rect x="133" y="213" width="60" height="6" rx="3" fill="#57d9e8">
      <animate attributeName="width" values="40;250;180;272;210;250" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.85;1;0.8;0.9" dur="9s" repeatCount="indefinite"/>
    </rect>
    <text x="446" y="222" class="tiny" font-size="11" fill="#8fb7bf">0x2C</text>
  </g>

  <!-- drifting scary numbers cluster (right) -->
  <g class="mono" font-size="15" fill="#4fb8c6">
    <rect x="590" y="74" width="252" height="120" rx="6" fill="#0b2f3b" stroke="#1c4c5b" stroke-width="1"/>
    <clipPath id="clip"><rect x="590" y="74" width="252" height="120" rx="6"/></clipPath>
    <g clip-path="url(#clip)">
      <g>
        <text x="606" y="96">4 9 1 7 3 0 8 2</text>
        <text x="606" y="120" fill="#7fe0ec">2 6 5 <tspan fill="#eaf7f9">9 9 4</tspan> 1 0 7</text>
        <text x="606" y="144">8 3 1 5 6 2 4 9 0</text>
        <text x="606" y="168" fill="#356f7c">1 7 2 4 8 3 5 1 9 6</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 2; 0 -4; 0 0" dur="12s" repeatCount="indefinite"/>
      </g>
      <text x="606" y="192" fill="#356f7c">0 4 2 8 1 9 3 7 5</text>
    </g>
    <text x="716" y="66" class="tiny" font-size="10" fill="#3f8391" text-anchor="middle">DATA · SCARY · COMPLETE</text>
  </g>
</svg>
